<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let It Go</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{position:relative}
#space{position:fixed;inset:0;overflow:hidden;background:#000}
.star{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:var(--o);box-shadow:0 0 7px rgba(255,255,255,.45);animation:drift var(--d) linear infinite;will-change:transform}
@keyframes drift{
  0%{transform:translate3d(0,0,0)}
  25%{transform:translate3d(var(--x1),var(--y1),0)}
  50%{transform:translate3d(var(--x2),var(--y2),0)}
  75%{transform:translate3d(var(--x3),var(--y3),0)}
  100%{transform:translate3d(0,0,0)}
}
#app{position:relative;z-index:2;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.panel{width:min(720px,88vw);text-align:center;transition:opacity 2s ease}
.title{font-size:clamp(26px,4vw,42px);font-weight:300;letter-spacing:.08em;margin-bottom:12px}
.subtitle{font-size:14px;line-height:1.7;color:#aaa;margin-bottom:34px}
textarea{
  display:block;width:100%;height:220px;resize:none;
  background:rgba(0,0,0,.35);color:#eee;border:1px solid rgba(255,255,255,.28);
  border-radius:4px;outline:none;padding:24px;font:300 17px/1.7 Inter,system-ui,sans-serif;
  transition:border-color .3s,box-shadow .3s,transform 2.8s cubic-bezier(.2,.8,.2,1),opacity 2.8s ease;
}
textarea:focus{border-color:rgba(255,255,255,.7);box-shadow:0 0 30px rgba(255,255,255,.04)}
textarea::placeholder{color:#666}
#release{
  margin-top:22px;padding:12px 28px;border:1px solid rgba(255,255,255,.35);
  border-radius:999px;background:transparent;color:#fff;cursor:pointer;
  font:400 13px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;
  transition:background .3s,border-color .3s,transform .3s
}
#release:hover{background:#fff;color:#000;border-color:#fff;transform:translateY(-2px)}
#hint{margin-top:18px;color:#555;font-size:11px;letter-spacing:.08em}
#message{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(760px,82vw);height:min(70vh,600px);
  overflow-y:auto;overflow-x:hidden;
  padding:18px 18px 30px;
  font:300 clamp(17px,2vw,21px)/2 Inter,system-ui,sans-serif;
  letter-spacing:.015em;color:#eee;text-align:center;
  white-space:pre-line;
  opacity:0;visibility:hidden;scroll-behavior:auto;
  scrollbar-width:none;
}
#message::-webkit-scrollbar{display:none}
#message.visible{visibility:visible}
.cursor{display:inline-block;width:1px;height:1.05em;background:#fff;margin-left:3px;vertical-align:-.15em;animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
#again{
  position:absolute;left:50%;bottom:8%;transform:translateX(-50%);
  opacity:0;pointer-events:none;background:none;border:0;color:#777;
  font:12px Inter,sans-serif;letter-spacing:.12em;cursor:pointer;text-transform:uppercase;
  transition:color .3s,opacity .8s
}
#again:hover{color:#fff}
#absorbingStar{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 18px 7px rgba(255,255,255,.6);z-index:3}
.release-mode textarea{transform:scale(.03) translateY(0);opacity:0}
.release-mode #release,.release-mode .title,.release-mode .subtitle,.release-mode #hint{opacity:0;pointer-events:none}
</style>
</head>
<body>
<audio id="bgMusic" preload="auto">
    <source src="letitgo.mp3" type="audio/mpeg">
</audio>
<div id="space"></div>
<div id="absorbingStar"></div>
<div id="app">
  <section class="panel" id="panel">
    <div class="title">Let it go.</div>
    <div class="subtitle">You don't have to carry everything with you.<br>Put it here. Then let the universe hold it for a while.</div>
    <textarea id="worry" maxlength="1800" placeholder="Write whatever is on your mind..."></textarea>
    <button id="release">Release</button>
    <div id="hint">Nothing is saved.</div>
  </section>
  <div id="message"><span id="typed"></span><span class="cursor"></span></div>
  <button id="again">Let something else go&nbsp; →</button>
</div>

<script>
const space=document.getElementById('space');
const count=Math.min(420,Math.floor(innerWidth*innerHeight/3000));
for(let i=0;i<count;i++){
  const s=document.createElement('span'); s.className='star';
  s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%';
  s.style.setProperty('--s',(Math.random()*2.4+.5).toFixed(2)+'px');
  s.style.setProperty('--o',(Math.random()*.65+.2).toFixed(2));
  s.style.setProperty('--d',(Math.random()*35+22).toFixed(1)+'s');
  s.style.setProperty('--x1',(Math.random()*90-45).toFixed(0)+'px');
  s.style.setProperty('--y1',(Math.random()*90-45).toFixed(0)+'px');
  s.style.setProperty('--x2',(Math.random()*140-70).toFixed(0)+'px');
  s.style.setProperty('--y2',(Math.random()*140-70).toFixed(0)+'px');
  s.style.setProperty('--x3',(Math.random()*80-40).toFixed(0)+'px');
  s.style.setProperty('--y3',(Math.random()*80-40).toFixed(0)+'px');
  s.style.animationDelay=(-Math.random()*35)+'s';
  space.appendChild(s);
}

const panel=document.getElementById('panel');
const worry=document.getElementById('worry');
const release=document.getElementById('release');
const msg=document.getElementById('message');
const typed=document.getElementById('typed');
const again=document.getElementById('again');
const absorber=document.getElementById('absorbingStar');

function makeResponse(text){
  return `Hello.

Anxious?
Stressed?
Worried about what comes next?

Look around.

You are standing on a planet moving through space at thousands of kilometres an hour,
spinning around a star,
in a galaxy among billions of others.

And somehow, you're here.

You get to see sunsets that have travelled millions of kilometres just to reach your eyes.
You get to hear someone's laugh and remember it.
You get to love.
To lose.
To dream.
To begin again.

The universe has existed for billions of years,
and you were given a few decades inside it.

So don't spend your whole life waiting for it to begin.

There will always be something to worry about.
Another mistake to regret.
Another tomorrow to fear.

But this moment?

You'll never get it again.

So go.

Chase the thing that scares you.
Say what you've been afraid to say.
Make something beautiful.
Get lost.
Look at the stars.

You are here.

And for a brief, impossible moment—

the universe gets to experience itself through you.

And perhaps that is enough.

Not to have everything figured out.
Not to become someone else.
Not to finally reach some distant version of yourself that you've been waiting for.

Just to realize—

you were never waiting for your life to begin.

You were already living it.

Every failure was part of the story.
Every goodbye changed the shape of you.
Every ordinary morning was a moment you would one day wish you could return to.

And now you know.

You don't need to be fearless.
You only need to keep going.

So step forward.

The world hasn't ended.

It has only just become yours.
Love, Ari <3 `;
}

release.addEventListener('click',()=>{
  const bgMusic = document.getElementById('bgMusic');
  bgMusic.currentTime = 0;
  bgMusic.volume = 0.28;
  bgMusic.play().catch(()=>{});
  if(!worry.value.trim()) { worry.focus(); return; }
  panel.classList.add('release-mode');
  const r=worry.getBoundingClientRect();
  absorber.style.left=(r.left+r.width*.78)+'px';
  absorber.style.top=(r.top+r.height*.5)+'px';
  absorber.style.opacity='1';
  absorber.animate([
    {transform:'translate(0,0) scale(1)',opacity:0},
    {transform:'translate(0,0) scale(2.4)',opacity:1},
    {transform:'translate(12px,-8px) scale(2)',opacity:.95},
    {transform:'translate(35px,-24px) scale(1.5)',opacity:.85},
    {transform:'translate(70px,-48px) scale(1.05)',opacity:.72},
    {transform:'translate(110px,-72px) scale(.78)',opacity:.62},
    {transform:'translate(160px,-96px) scale(.55)',opacity:.52},
    {transform:'translate(215px,-120px) scale(.36)',opacity:.42},
    {transform:'translate(275px,-145px) scale(.18)',opacity:.32},
    {transform:'translate(340px,-170px) scale(.08)',opacity:.22}
  ],{duration:6500,easing:'cubic-bezier(.16,.7,.22,1)',fill:'forwards'});
  setTimeout(()=>{
    absorber.style.boxShadow='0 0 8px 3px rgba(255,255,255,.45)';
    msg.classList.add('visible');
    msg.style.opacity='1';
    typeText(makeResponse(worry.value),92);
  },6100);
});
function typeText(text,speed){
  typed.textContent='';
  msg.scrollTop=0;
  let i=0;
  let scrolling=false;
  let scrollFrame=null;
  let lastTime=0;

  function slowScroll(time){
    if(!scrolling) return;
    if(!lastTime) lastTime=time;
    const delta=time-lastTime;
    lastTime=time;

    const maxScroll=msg.scrollHeight-msg.clientHeight;
    if(maxScroll>0){
      // Very slow, steady upward movement, like cinematic end credits.
      msg.scrollTop=Math.min(maxScroll,msg.scrollTop + delta*0.018);
    }

    scrollFrame=requestAnimationFrame(slowScroll);
  }

  function startScroll(){
    if(!scrolling){
      scrolling=true;
      lastTime=0;
      scrollFrame=requestAnimationFrame(slowScroll);
    }
  }

  const tick=()=>{
    if(i<text.length){
      const ch=text[i++];
      typed.textContent+=ch;

      // Start the upward drift once enough text exists to scroll.
      if(msg.scrollHeight>msg.clientHeight*1.08) startScroll();

      let delay=speed;
      if(ch==='\\n'){
        // One line break = pause; blank line = bigger cinematic pause.
        delay=text[i]==='\\n' ? speed*12 : speed*6;
      } else if(ch==='.' || ch==='?' || ch==='!'){
        delay=speed*4.5;
      } else if(ch==='—'){
        delay=speed*3.5;
      } else if(ch===','){
        delay=speed*2.2;
      }

      setTimeout(tick,delay);
    } else {
      // Let the final lines continue their slow upward movement.
      setTimeout(()=>{
        if(scrollFrame) cancelAnimationFrame(scrollFrame);
        again.style.opacity='1';
        again.style.pointerEvents='auto';
      },1800);
    }
  };

  tick();
}
again.addEventListener('click',()=>{
  again.style.opacity='0';again.style.pointerEvents='none';
  msg.style.opacity='0';
  setTimeout(()=>{
    msg.classList.remove('visible'); typed.textContent='';
    worry.value=''; panel.classList.remove('release-mode');
    absorber.style.opacity='0';
    worry.focus();
  },900);
});
</script>
</body>
</html>
